[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osreach"
version = "0.1.0"
description = "SMT-based reachability verification for OpenStack Neutron: security groups, routers, floating IPs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "YOUR NAME" }]
keywords = ["openstack", "neutron", "security-groups", "smt", "z3", "formal-methods", "network-verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
dependencies = ["z3-solver>=4.12", "PyYAML>=6"]

[project.optional-dependencies]
openstack = ["openstacksdk>=1.0"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
osreach = "osreach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "UP007", "UP045"]
